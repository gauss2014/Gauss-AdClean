name: Validate modules

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Validate
        run: |
          python3 tools/build_module.py --check
          python3 tools/validate.py
          python3 tools/test_splash_rules.py
          python3 tools/test_host_policy.py
          node --test tools/test_xianyu_splash.js
          node --test tools/test_jd_splash.js
